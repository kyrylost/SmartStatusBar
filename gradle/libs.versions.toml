[versions]
agp = "9.4.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coroutinesTest = "1.11.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
coil = "3.6.3"
mavenPublish = "0.37.0"
# The library depends on the lowest versions that have the APIs it uses, so that it does not force
# apps to upgrade. The sample and the tests use the BOM. Compose Multiplatform 1.7.0 maps to
# Jetpack Compose 1.7.1 on Android.
libComposeMultiplatform = "1.7.0"
libCompose = "1.7.1"
libLifecycle = "2.8.3"
libCoreKtx = "1.12.0"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# Library
lib-compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "libComposeMultiplatform" }
lib-compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "libComposeMultiplatform" }
lib-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "libCompose" }
lib-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "libLifecycle" }
lib-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "libCoreKtx" }

# Images
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
